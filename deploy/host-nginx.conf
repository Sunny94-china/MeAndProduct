# Nginx 反代片段已收录在 docs/deploy.md（规范要求文档内可贴用）。
# 本文件便于直接拷贝；端口请与 .env 中 API_PORT/PUBLIC_PORT/ADMIN_PORT 一致。
#
#   见 docs/deploy.md「接入服务器已有 Nginx」

upstream meandproduct_api {
    server 127.0.0.1:18080;
    keepalive 16;
}
upstream meandproduct_public {
    server 127.0.0.1:18081;
    keepalive 8;
}
upstream meandproduct_admin {
    server 127.0.0.1:18082;
    keepalive 8;
}

server {
    listen 80;
    server_name meandproduct.example.com;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://meandproduct_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://meandproduct_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /admin { return 301 /admin/; }
    location = /founder { return 302 /studio; }
    location /founder/ { return 302 /studio; }

    location / {
        proxy_pass http://meandproduct_public;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
