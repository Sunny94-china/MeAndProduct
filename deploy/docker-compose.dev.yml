# 本地开发环境 —— 仅 MySQL 8 + Redis 7（仅本机开发用）
# 用法: make dev （从仓库根目录）
# 容器名 / volume 都带 meandproduct- 前缀。
# 若本机已有 MySQL(3306) / Redis(6379)，先改下面的宿主机端口映射，避免冲突。
# 生产服务器请用仓库根目录 docker-compose.yml，不要跑这份文件。

services:
  mysql:
    image: mysql:8.0
    container_name: meandproduct-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_pwd
      MYSQL_DATABASE: meandproduct
      MYSQL_USER: meandproduct
      MYSQL_PASSWORD: dev_pwd
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev_root_pwd"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meandproduct-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass dev_redis_pwd
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_pwd", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql-dev-data:
  redis-dev-data:
