user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 20m;

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ================== upstream: backend ==================
    upstream backend_server {
        server backend:8080 max_fails=3 fail_timeout=30s;
    }

    # 外层 Nginx 传来的协议；没有时用容器自己的 $scheme
    map $http_x_forwarded_proto $mp_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;
        # ========== HTTPS（生产按需开启）==========
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/ssl/server.crt;
        # ssl_certificate_key /etc/nginx/ssl/server.key;
        # if ($scheme != "https") { return 301 https://$host$request_uri; }

        # -------- 0) /api/ 反代 Go backend --------
        location /api/ {
            proxy_pass         http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $mp_proto;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ================================================================
        # 1) 管理员后台 /admin/*  (SPA + 打包产物静态资源长缓存)
        #    Vite base="/admin/" 时：
        #       index.html            -> /usr/share/nginx/admin/index.html
        #       assets/index-xxx.js   -> /usr/share/nginx/admin/assets/index-xxx.js
        # ================================================================
        location ^~ /admin/assets/ {
            alias /usr/share/nginx/admin/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location /admin/ {
            alias /usr/share/nginx/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 创业者工作台已并入前台 /studio。用客户端 Host，避免容器内 80 端口把外部映射端口丢掉
        location = /founder {
            return 302 $mp_proto://$http_host/studio;
        }
        location /founder/ {
            return 302 $mp_proto://$http_host/studio;
        }

        # ================================================================
        # 3) 前台 public-site /*  (SPA + 打包产物静态资源长缓存)
        # ================================================================
        location ^~ /assets/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location = /favicon.ico {
            root /usr/share/nginx/html;
            log_not_found off;
            access_log off;
        }
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
